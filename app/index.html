<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Second Source</title>
  <!-- Built to match Figma "Second Source 'final'" (node 2020:17988), 10/15. Earlier page: index-before-figma.html. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f9f9f7;
      --sidebar-bg: #faf9f5;
      --text-primary: #141413;
      --text-secondary: #3d3d3a;
      --text-tertiary: #73726c;
      --text-info: #3266ad;
      --border-info: #4682d5;
      --border-secondary: rgba(31, 30, 29, 0.3);
      --border-tertiary: rgba(31, 30, 29, 0.15);
      --claim-bg: #eef1f6;
      --supported: #31891c;
      --contradicted: #b53333;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text-primary); }
    body { font-family: var(--sans); font-size: 15px; line-height: 1.6; letter-spacing: -0.01em; padding-bottom: 40px; }
    a { color: var(--text-info); text-decoration-thickness: 6%; }

    /* ---------- Sidebar: non-working framing, toned down (Ben, 10/15) ---------- */
    #sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 53px; padding: 0 8px 12px; background: var(--sidebar-bg);
      border-right: 0.5px solid var(--border-secondary); display: flex; flex-direction: column; justify-content: space-between; z-index: 5; }
    #sidebar .icons { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 36px; opacity: 0.4; } /* how quiet: Claude's pick (40%) */
    #sidebar .icons .top { height: 68px; display: flex; align-items: center; justify-content: center; }
    #sidebar .icons .nav { display: flex; flex-direction: column; align-items: center; }
    #sidebar .icons .nav span { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
    #sidebar .avatar { padding: 4px; opacity: 0.4; }
    #sidebar svg { display: block; }
    #sidebar-tip { position: fixed; left: 61px; display: none; z-index: 30; }
    #sidebar-tip .bubble { position: relative; }
    #sidebar-tip .tip-wrap { position: relative; }
    #sidebar-tip .arrow { position: absolute; left: -13px; top: 11px; z-index: 1; }

    /* ---------- Page ---------- */
    #main { margin-left: 53px; padding: 24px 64px 12px; display: flex; flex-direction: column; align-items: center; gap: 36px; }
    .content { width: 100%; max-width: 1100px; }

    /* Query input */
    #query { width: 765px; max-width: 100%; background: #fff; border: 1px solid var(--border-tertiary); border-radius: 15px;
      padding: 12px 16px; display: flex; align-items: center; gap: 10px;
      filter: drop-shadow(-2px -2px 2px rgba(0,0,0,0.04)) drop-shadow(2px 2px 2px rgba(0,0,0,0.04)); }
    #question { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; color: var(--text-primary); padding: 0; }
    #send { border: 0; background: none; padding: 0; cursor: pointer; display: flex; }
    #send:disabled { cursor: default; opacity: 0.5; }
    #status { margin: -24px 0 0; min-height: 0; color: var(--text-tertiary); font-size: 14px; }
    #status:empty { display: none; }

    /* Question menu (Figma 2154:4811 open, 2154:5334 collapsed; Ben, 10/23) */
    #qwrap { position: relative; z-index: 30; width: 765px; max-width: 100%; }
    #qwrap #query { position: relative; z-index: 2; }
    #qmenu { position: absolute; left: 0.5px; top: 37px; width: 764px; max-width: calc(100% - 1px); z-index: 1; background: #fff;
      border: 1px solid var(--border-tertiary); border-radius: 0 0 16px 16px; padding: 24px 16px 16px; display: flex; flex-direction: column; gap: 16px;
      filter: drop-shadow(-1px -1px 2px rgba(0,0,0,0.2)) drop-shadow(1px 1px 2px rgba(0,0,0,0.2)); }
    #qmenu[hidden] { display: none; }
    .qsec { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .qsec.recent { gap: 10px; }
    .qsec[hidden] { display: none; }
    .qhead { display: flex; gap: 12px; align-items: flex-start; }
    .qhead span { flex: 1; min-width: 0; font-weight: 500; font-size: 12px; line-height: normal; color: var(--text-primary); }
    .qcaret { border: 0; background: none; padding: 4px 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; align-self: stretch; color: var(--text-primary); }
    .qcaret svg { display: block; }
    .qcaret[aria-expanded="true"] svg { transform: rotate(180deg); }
    .qitem { border: 0; background: none; padding: 0; font: inherit; font-size: 15px; font-weight: 400; line-height: normal; color: var(--text-tertiary); text-align: left;
      cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .qempty { font-size: 15px; line-height: normal; color: var(--text-tertiary); margin: 0; }

    /* Section headings */
    .head { display: flex; align-items: center; justify-content: space-between; gap: 60px; border-bottom: 0.5px solid var(--border-secondary); }
    .head h2 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 18px; line-height: 1.6; letter-spacing: -0.01em; }
    #verify-head { font-family: var(--sans); } /* Verifier heading in Inter (Ben, 10/20); "Claude's response" stays serif */
    #verify-label { position: relative; display: flex; align-items: center; height: 26px; font-weight: 500; color: var(--text-secondary); cursor: pointer; user-select: none; }
    #verify-on { position: absolute; opacity: 0; width: 0; height: 0; }
    #verify-box { position: absolute; left: -25px; top: 0; width: 20px; height: 20px; border-radius: 6px; border: 0.5px solid var(--border-info);
      background: var(--border-info); display: flex; align-items: center; justify-content: center; }
    #verify-on:not(:checked) + #verify-box { background: #fff; border-color: var(--border-secondary); }
    #verify-on:not(:checked) + #verify-box svg { display: none; }
    #verify-on:focus-visible + #verify-box { outline: 2px solid var(--border-info); outline-offset: 2px; }

    /* Claude's response: answer left, "Claude searched:" right (Ben, 10/15) */
    #response { display: flex; flex-direction: column; gap: 16px; }
    .answer-row { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 520px); justify-content: space-between; column-gap: 60px; align-items: start; } /* Figma 10/21: top-aligned, right column 4px down */
    #answer .v-working { font-family: var(--sans); white-space: normal; }
    #answer { font-family: var(--serif); font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
    #searched { position: relative; overflow: hidden; padding-top: 4px; }
    /* "CLAUDE SEARCHED:" header row with the caret at its right end (Figma 10/21) */
    .s-head { display: flex; align-items: flex-start; max-width: 501px; }
    .s-head .label { flex: 1; min-width: 0; font-size: 12px; font-weight: 500; line-height: 1.6; color: var(--text-secondary); white-space: nowrap; }
    #searched .links, .search-overlay .links { display: block; max-width: 501px; }
    .search-overlay .links { max-width: 504px; }
    #searched .links { overflow: hidden; }
    #searched .links a, .search-overlay a { white-space: nowrap; }
    .links .more { color: var(--text-info); }
    .caret { width: 20px; height: 20px; flex: none; display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;
      border: 0; border-radius: 6px; background: none; color: var(--text-secondary); }
    .caret svg { display: block; transition: transform 0.15s; }
    .caret[aria-expanded="true"] svg { transform: rotate(180deg); }
    #searched-wrap { position: relative; }
    /* Accordions open as an overlay on top; nothing on the page shifts (Ben, 10/15) */
    .search-overlay { display: none; position: absolute; left: -9px; top: -5px; width: 520px; max-width: calc(100% + 9px); z-index: 20; background: var(--bg);
      border: 1px solid rgba(31,30,29,0.4); border-radius: 0; padding: 8px; filter: drop-shadow(2px 2px 1px rgba(0,0,0,0.15)); } /* Figma 10/21: page color, square corners, 8px padding; top -5px = 4px top padding of the column - 9px, so the text doesn't move when it opens */
    .search-overlay.open { display: block; }
    .search-overlay .s-head { max-width: none; }
    .cap-row { display: flex; gap: 8px; margin-top: 8px; }
    .cap-btn { font: inherit; padding: 4px 12px; border: 1px solid var(--border-secondary); border-radius: 8px; background: #fff; cursor: pointer; }
    .no-search { font-weight: 400; color: var(--text-secondary); } /* regular weight (Ben, 10/19) */
    #searched.none { padding-top: 0; } /* "No sources checked" sits on the same line as the answer's first line (Ben, 10/22); the 4px drop is only for the "CLAUDE SEARCHED:" label */

    /* Verifier */
    #verify-col { display: flex; flex-direction: column; gap: 0; }
    .vclaim { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 520px); justify-content: space-between; column-gap: 60px; align-items: start;
      padding-bottom: 24px; border-bottom: 0.5px solid var(--border-secondary); }
    /* Verifier working: spinner + line while the check runs (Ben, 10/19) */
    .v-working { display: flex; align-items: center; gap: 10px; color: var(--text-secondary); }
    .spinner { width: 20px; height: 20px; border-radius: 50%; border: 3px solid rgba(70,130,213,0.2); border-top-color: var(--border-info); animation: spin 0.8s linear infinite; flex: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .vclaim:last-child { border-bottom: none; } /* no line under the last claim (Ben, 10/19) */
    .vclaim + .vclaim { margin-top: 24px; } /* 24px below each dividing line (Figma 10/21) */
    .vleft { display: flex; flex-direction: column; gap: 16px; }
    /* Claim: bold serif, no shaded box (Figma 10/21) */
    .claim-box { padding: 8px 16px 8px 0; font-family: var(--serif); font-weight: 600; }
    /* Under the claim: abilities + documentation density on the left (314px, 16px in), confidence centred on the right (Figma 10/21) */
    .cinfo { display: flex; align-items: flex-start; }
    .cinfo-l { width: 314px; flex: none; padding-left: 0; display: flex; flex-direction: column; gap: 20px; }
    .cinfo-r { flex: 1; min-width: 0; display: flex; justify-content: center; }
    .info-block { display: flex; flex-direction: column; gap: 8px; }
    /* Label tooltips (Ben, 10/21): same bubble as the sidebar tooltip, centred above the label, arrow pointing down at it */
    .tip-host { position: relative; align-self: flex-start; cursor: default; }
    .tip { display: none; position: absolute; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%); z-index: 12;
      filter: drop-shadow(2px 2px 1px rgba(0,0,0,0.15)); }
    .tip .bubble { filter: none; font-weight: 400; color: #000; letter-spacing: -0.01em; }
    .tip .down { position: absolute; left: 50%; top: calc(100% - 1px); transform: translateX(-50%); display: block; }
    .tip-group:hover .tip { display: block; } /* label and its content both trigger the tooltip (Ben, 10/21) */
    .cinfo-l .info-block { align-self: flex-start; }
    /* "Leaves this site" icon after outside links (Ben, 10/21) */
    .ext { display: inline-block; vertical-align: -1px; margin-left: 3px; color: var(--text-info); }
    .host { white-space: nowrap; }
    /* "See more" in the summary box opens the full list on top; nothing below moves (Ben, 10/21) */
    #v-box { position: relative; }
    .f-toggle { color: var(--text-info); text-decoration: underline; text-decoration-thickness: from-font; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; display: block; align-self: flex-end; }
    #v-findings > .f-toggle { margin: 16px 0 0 auto; } /* right side, like the caret on "Claude searched"; 16px gap like the bullets (Ben, 10/21) */
    .jump { display: inline-block; vertical-align: -1px; margin-left: 3px; } /* down arrow: this link jumps down the page (Ben, 10/21) */
    .f-all { display: none; position: absolute; left: -0.5px; right: -0.5px; top: -0.5px; z-index: 15; background: var(--claim-bg); border: 0.5px solid rgba(31,30,29,0.4);
      padding: 16px 16px 24px; flex-direction: column; gap: 16px; filter: drop-shadow(2px 2px 1px rgba(0,0,0,0.15)); }
    .f-all.open { display: flex; }
    .lbl { font-size: 12px; font-weight: 500; line-height: 1.6; color: var(--text-secondary); white-space: nowrap; }
    .ab-list { margin: 0; padding-left: 21px; font-size: 14px; font-weight: 500; line-height: 1.6; color: var(--text-tertiary); }
    .ab-list li + li { margin-top: 4px; }
    .dd-val { padding-left: 16px; font-size: 14px; font-weight: 500; line-height: 1.6; color: var(--text-tertiary); }
    .conf { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .conf .gwrap { padding: 0 24px 4px; }
    .gauge { position: relative; width: 88px; height: 46px; }
    .gauge svg { position: absolute; left: 0; top: 0; overflow: visible; }
    .gauge .num { position: absolute; left: 0; right: 0; top: 19px; text-align: center; font-weight: 500; font-size: 20px; line-height: 21px; color: var(--text-tertiary); letter-spacing: -0.01em; }
    .gauge .base { position: absolute; left: 1px; top: 46px; width: 86px; height: 0; border-top: 1px solid var(--border-tertiary); }
    /* Verifier heading: title + (?) icon, no line under it (Figma 10/21) */
    .head.vhead { display: flex; align-items: center; justify-content: flex-start; gap: 8px; border-bottom: 0; margin-bottom: 4px; }
    #explain-btn { border: 0; background: none; padding: 0; cursor: pointer; font-family: var(--sans); font-weight: 400; font-size: 14px; line-height: 1.6; letter-spacing: -0.14px; color: #3266ad; text-decoration: underline; text-decoration-color: #3266ad; text-decoration-thickness: 10%; } /* text link, not an icon (Ben, 10/22; Figma 2099:7072) */
    /* Summary box (Figma 10/21): count line, then the confidence/source mismatches as bullets */
    #v-box[hidden] { display: none; }
    #v-box { background: var(--claim-bg); border: 1px solid rgba(31,30,29,0.4); padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px; margin-bottom: 36px; }
    #v-summary { font-weight: 600; }
    #v-box ul { margin: 0; padding-left: 22.5px; }
    #v-box li + li { margin-top: 16px; }
    #v-box b, .f-all .f-count { font-weight: 600; }
    #v-box a { color: var(--text-info); text-decoration-thickness: from-font; }
    #v-findings p { margin: 0; }
    .vclaim.flash { background: var(--claim-bg); transition: background 0.3s; }
    #verify-col { position: relative; }
    /* "What am I looking at?" full page, built from Figma "More info overlay" (node 2117:8504, Ben 10/22).
       All positions are the Figma frame's: a 1440px-wide page, content starting 150px in. */
    #explain[hidden] { display: none; }
    #explain { position: fixed; inset: 0; z-index: 60; background: #eee; overflow: auto; opacity: 0; transition: opacity 0.25s ease; } /* page color #eee (Ben, 10/22) */
    #explain.show { opacity: 1; } /* dissolve in and out, a quarter second (Ben, 10/22) */
    .ex-page { position: relative; width: 1440px; margin: 0 auto; padding: 30px 0 219px; box-sizing: border-box; color: #000; }
    .ex-back { position: absolute; left: 46px; top: 29px; height: 32px; padding: 0 12px; display: flex; align-items: center; gap: 4px; border: 0; border-radius: 6px; background: none; cursor: pointer;
      font-family: var(--sans); font-weight: 600; font-size: 12px; line-height: 1.4; color: #3d3d3a; font-feature-settings: "salt" 1; }
    .ex-back svg { display: block; flex: none; }
    .ex-h { margin: 0 0 0 150px; font-family: var(--serif); font-weight: 600; font-size: 24px; line-height: 30px; color: #000; }
    /* About the Verifier: two 570px columns from 83px (title ends at 60 -> 23px gap); 15px / 24px text; a blank 24px line between items */
    .ex-cols { display: flex; margin: 23px 0 0 150px; width: 1140px; font-size: 15px; line-height: 24px; letter-spacing: normal; }
    .ex-cols > div { width: 570px; box-sizing: border-box; }
    .ex-cols .ex-l { padding-right: 24px; } .ex-cols .ex-r { padding-left: 24px; }
    .ex-cols p { margin: 0; } .ex-cols ul { margin: 0; padding-left: 45px; }
    .ex-cols p + *, .ex-cols ul + * { margin-top: 24px; }
    .ex-cols .ex-lim { font-weight: 600; }
    .ex-cols a { color: #3266ad; text-decoration: underline; text-decoration-thickness: from-font; }
    /* Anatomy title at 459 (left column ends at 419 -> 40px), diagram from 520 (31px below the title) to 1201 (681px tall) */
    .ex-anat { margin-top: 40px; }
    .ex-diagram { position: relative; margin: 31px 0 0 150px; width: 1140px; height: 681px; }
    .ex-diagram .ex-claimimg { position: absolute; left: 0; top: 112px; width: 1140px; height: 280px; box-sizing: border-box; border: 1px solid rgba(31,30,29,0.4); background: var(--bg); } /* live example, page parts placed to match Ben's image (10/22) */
    /* Pink connector lines (Figma "lines" group): a 1px line with an 11px dot at the item end */
    .ex-line { position: absolute; width: 11px; }
    .ex-line::before { content: ""; position: absolute; left: 5px; top: 0; bottom: 0; border-left: 1px solid #EF5DA8; }
    .ex-line::after { content: ""; position: absolute; left: 0; width: 11px; height: 11px; border-radius: 50%; background: #EF5DA8; }
    .ex-line.dot-bottom::after { bottom: 0; } .ex-line.dot-top::after { top: 0; }
    /* Callouts (Figma "Claim" frames): 370px, white, 1px border, 8px / 12px padding, bold title, 5px gap, 16px text */
    .callout { position: absolute; width: 370px; box-sizing: border-box; background: #fff; border: 1px solid rgba(31,30,29,0.4); padding: 8px 12px; display: flex; flex-direction: column; gap: 5px;
      font-family: var(--sans); font-size: 16px; line-height: normal; letter-spacing: normal; color: #141413; z-index: 1; }
    .callout b { font-weight: 700; } .callout p { margin: 0; }
    .ex-row { position: absolute; left: 39px; top: 16px; width: 1058px; border-bottom: 0; padding-bottom: 0; } /* where the row sat in Ben's image */
    .ex-qs { margin: 0 0 0 150px; font-size: 15px; line-height: 30px; letter-spacing: normal; }
    .ex-qs p { margin: 0; }
    .ex-qs p:first-child { font-weight: 600; } /* "When Claude gets it wrong, why?" semibold (Ben, 10/22) */
    .ex-box { margin: 28px 0 0 150px; width: 1141px; box-sizing: border-box; border: 1px solid rgba(31,30,29,0.4); background: #f9f9f7; padding: 16px; font-size: 15px; line-height: 30px; letter-spacing: normal; color: #141413; }
    .ex-box ul { margin: 0; padding-left: 24px; }
    .ex-box a { color: #3266ad; text-decoration: underline; text-decoration-thickness: from-font; } /* same as the source-list links above */
    .ph { color: var(--text-tertiary); } /* visible placeholder (Ben, 10/22) */
    /* Summary box lines (Figma 2099:6993): each line its own bullet, 16px apart (the box's gap), label semibold */
    #v-findings { display: flex; flex-direction: column; gap: 16px; }
    #v-findings:empty { display: none; }
    #v-findings ul { margin: 0; padding-left: 22.5px; }
    #v-findings .s-label { font-weight: 600; }
    .cites { display: flex; flex-direction: column; gap: 16px; align-items: flex-end; min-width: 0; }
    .no-source { font-size: 15px; color: var(--text-tertiary); padding-top: 8px; width: 100%; max-width: 520px; padding-left: 0; } /* lines up with the citation quotes (Ben, 10/22) */ /* lines up with the verdict words ("Citation supports claim") */
    /* Short "why" next to "No reliable source found" (Ben, 10/22): one line, the reasons on hover. Tooltip anchored left so it stays inside the column. */
    .ns-link { position: relative; display: inline-block; cursor: default; } /* plain text, same gray as before; hover shows the reasons (Ben, 10/22) */
    .ns-link .tip { left: 0; top: calc(100% + 10px); bottom: auto; transform: none; text-align: left; } /* opens below the text (Ben, 10/22) */
    .ns-link .tip .down { left: 24px; top: auto; bottom: calc(100% - 1px); transform: rotate(180deg); } /* arrow points up at the text */
    .ns-link .bubble { white-space: normal; width: max-content; max-width: 320px; line-height: 1.45; text-decoration: none; }
    .ns-link .ns-title { font-weight: 600; }
    .ns-link .bubble ul { margin: 4px 0 0; padding-left: 18px; }
    .ns-link:hover .tip { display: block; }
    .bucket-note, .v-working { max-width: 520px; } /* Verifier messages outside the claim/citation rows stay within the left column, like Claude's response (Ben, 10/20) */
    .bucket-note { color: var(--text-secondary); }

    /* One citation, Figma "Second Source_3" (node 2054:19574, Ben 10/20): a header row with the verdict icon and its
       words, then the quote (two lines at rest) and the site link. Hover shows the full quote in an overlay on top (Ben, 10/15). */
    .cite { position: relative; width: 100%; max-width: 520px; }
    /* Figma 10/21: no left inset; icon, quote and site all start at the column edge; 4px between rows */
    .cite-row { display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 8px 16px 8px 0; border-radius: 16px; }
    .cite-head { display: flex; gap: 8px; align-items: flex-start; padding: 0; }
    .cite-head .vicon { flex: none; width: 22px; height: 22px; }
    .cite-head .vicon svg { display: block; }
    .cite-head .vlabel { font-weight: 500; white-space: nowrap; }
    .cite-row .rcol { display: flex; flex-direction: column; gap: 4px; padding: 0; min-width: 0; }
    .cite-row .quote { margin: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
    .cite-row .src { display: flex; justify-content: flex-end; gap: 4px; font-size: 14px; white-space: nowrap; align-items: baseline; }
    .cite-row .src .host { color: var(--text-info); text-decoration: underline; text-decoration-thickness: 6%; }
    .cite-full { display: none; position: absolute; left: -18px; top: -2px; right: 0; z-index: 10; background: #fff; padding: 8px 14px 8px 16px;
      border: 2px solid var(--border-info); color: inherit; text-decoration: none; cursor: pointer;
      box-shadow: 2px 2px 2px rgba(0,0,0,0.15); } /* shadow on the card's edge only, not the text (Ben, 10/21). Figma 10/21: card sticks out 18px to the left so its text lines up with the resting text; top -2px keeps the text from moving */ /* shadow only on the hover card, not the resting rows (Ben, 10/19). top -4px: the hover card has 4px more top padding than the resting row, so the text no longer drops on hover (Ben, 10/20) */
    .cite-full .rcol { gap: 4px; }
    .cite-full .quote { display: -webkit-box; -webkit-line-clamp: 8; overflow: hidden; } /* hover card: at most 8 lines, then "…" (Ben, 10/22: very long quotes broke the page) */
    .cite-full .src .lead { font-size: 15px; font-weight: 500; color: var(--text-primary); }

    #build { position: fixed; left: 53px; right: 0; bottom: 0; margin: 0; padding: 4px 16px; font-size: 12px; color: #666; background: var(--bg); border-top: 1px solid #ddd; z-index: 4; }

        left.append(el("div", "claim-box", "“" + stripBold(s.claim).trim() + "”"));
        const seg = scored[s.n - 1];
        left.append(claimInfo(seg));
        const right = el("div", "cites");
        const cites = citationsFor(s);
        if (s.calc) right.append(calcCite(s.calc.ok ? "Supported" : "Contradicted", s.calc.line));
        for (const { verdict, p } of cites) right.append(citation(verdict, p));
        if (!cites.length && !s.calc) right.append(FAILED.includes(s.verdict) ? el("div", "no-source", s.verdict) : noSource()); // label (Ben, 10/19); short "why" (Ben, 10/22)
        rowEl.append(left, right);
        verified.append(rowEl);
      }
      lastV = { sections: out.sections, scored }; // the summary lines are written once the ability scores arrive (showAbilities)
    }

    // Build line (Ben, 10/7): shows which version is running; warns when the app needs a restart.
    const buildLine = document.getElementById("build");
    const when = (t) => new Date(t).toLocaleString([], { month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit" });
    async function showBuild() {
      try {
        const b = await (await fetch("/version")).json();
        buildLine.textContent = `Build: code ${when(b.codeChanged)} · page ${when(b.pageChanged)} · app started ${when(b.started)}` +
          (b.stale ? " · CODE CHANGED SINCE START: restart the app" : "");
        buildLine.className = b.stale ? "stale" : "";
      } catch { buildLine.textContent = "Build: unknown (app may need a restart)"; }
    }
    showBuild();

    // Enter in the question box submits (Ben, 10/7). The question stays in the box until the user clears it (Ben, 10/14).
    const CLAIM_CAP = 20; // Ben, 10/19
    function askToCheck(n) {
      return new Promise((resolve) => {
        const cents = Math.round(n * 0.9);
        const box = el("div", "bucket-note");
        box.append(el("p", "", `This answer has ${n} claims. Checking them all would cost about ${cents} cents, possibly more. Check anyway?`));
        const yes = el("button", "cap-btn", "Check anyway"), no = el("button", "cap-btn", "Skip");
        yes.type = "button"; no.type = "button";
        yes.onclick = () => resolve(true); no.onclick = () => resolve(false);
        const row = el("div", "cap-row"); row.append(yes, no); box.append(row);
        verified.append(box);
      });
    }

    // Question menu under the box (Ben, 10/23): Suggested questions above Recent questions, each an accordion.
    // Collapsed shows the first two. Open/closed is remembered as last used. Clicking a question fills the box and submits.
    // Closes on a click outside, Escape, or submitting. Typing narrows both lists to questions containing the typed text.
    // Recent questions: the last 6 this visitor asked, kept in this browser only; asking again moves it to the top.
    // Suggested list is Ben's Figma draft, still to be chosen. Empty recent list says "None" (Ben, 10/23); filter details are Claude's.
    const SUGGESTED = [
      "Was Napoleon unusually short?",
      "Was Walt Disney Studios' Snow White and the Seven Dwarfs the first animated film to be feature-length?",
      "What percentage of startups fail in their first year?",
      "Which modern LLM is the most powerful? Which is best to act as a coworker to a UX designer?",
      "How long will it take Gouda cheese to digest?",
      "How long is the average job tenure in the US?"
    ];
    const qmenu = document.getElementById("qmenu"), qwrap = document.getElementById("qwrap");
    const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
    let qOpen = store.get("2s-qmenu-open", { suggested: false, recent: false });
    const recentQs = () => { const r = store.get("2s-recent", []); return Array.isArray(r) ? r.filter((x) => typeof x === "string") : []; };
    function addRecent(text) {
      const t = text.trim(); if (!t) return;
      const r = recentQs().filter((x) => x.trim().toLowerCase() !== t.toLowerCase()); r.unshift(t); store.set("2s-recent", r.slice(0, 6));
    }
    const QCARET = '<svg width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true"><path d="M0.6 0.6 5 5 9.4 0.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    function qSection(key, title, items, filter) {
      const sec = el("div", "qsec" + (key === "recent" ? " recent" : ""));
      const head = el("div", "qhead"); head.append(el("span", "", title));
      const c = el("button", "qcaret"); c.type = "button"; c.innerHTML = QCARET;
      c.setAttribute("aria-label", (qOpen[key] ? "Show fewer " : "Show all ") + title.toLowerCase()); c.setAttribute("aria-expanded", String(!!qOpen[key]));
      c.addEventListener("mousedown", (e) => e.preventDefault()); // keep focus in the question box
      c.addEventListener("click", () => { qOpen[key] = !qOpen[key]; store.set("2s-qmenu-open", qOpen); renderQMenu(); });
      head.append(c); sec.append(head);
      const f = filter.trim().toLowerCase();
      let list = f ? items.filter((x) => x.toLowerCase().includes(f)) : items;
      if (f && !list.length) return null;
      if (!f && !qOpen[key]) list = list.slice(0, 2);
      if (!items.length) sec.append(el("p", "qempty", "None"));
      for (const text of list) {
        const b = el("button", "qitem", text); b.type = "button"; b.title = text;
        b.addEventListener("mousedown", (e) => e.preventDefault());
        b.addEventListener("click", () => { q.value = text; closeQMenu(); document.getElementById("query").requestSubmit(); });
        sec.append(b);
      }
      return sec;
    }
    function renderQMenu() {
      qmenu.textContent = "";
      const parts = [qSection("suggested", "SUGGESTED QUESTIONS", SUGGESTED, q.value), qSection("recent", "RECENT QUESTIONS", recentQs(), q.value)].filter(Boolean);
      if (!parts.length) { qmenu.hidden = true; return; }
      qmenu.append(...parts); qmenu.hidden = false;
    }
    function closeQMenu() { qmenu.hidden = true; }
    function openQMenu() { if (!q.disabled) renderQMenu(); }
    q.addEventListener("focus", openQMenu);
    q.addEventListener("click", openQMenu);
    q.addEventListener("input", openQMenu);
    q.addEventListener("keydown", (e) => { if (e.key === "Escape") closeQMenu(); });
    document.addEventListener("mousedown", (e) => { if (!qwrap.contains(e.target)) closeQMenu(); });

    // Return in the box submits, like the arrow button: the box is a form, so the browser handles it (Ben, 10/19).
    document.getElementById("query").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (send.disabled) return;
      if (!q.value.trim()) return;
      closeQMenu(); addRecent(q.value); // question menu (Ben, 10/23)
      // The user can't move forward until both answers are in (blocking).
      q.disabled = true; send.disabled = true; verifyOn.disabled = true;
      answer.textContent = ""; verified.textContent = ""; extraRoom = 0; mainEl.style.paddingBottom = ""; vBox.querySelectorAll(".f-all").forEach((x) => x.remove()); vSummary.textContent = ""; findingsEl.textContent = ""; vBox.hidden = true; searchUrls = []; searched.textContent = ""; searchOverlay.textContent = ""; setOverlay(false);
      { const w = el("div", "v-working"); w.append(el("span", "spinner"), el("span", "", "Thinking...")); answer.append(w); } // spinner + line, same as the Verifier (Ben, 10/21)
      try {
        const data = await post("/ask", { question: q.value });
        answer.textContent = ""; // remove the spinner
        lastSegments = data.segments || [];
        // Space between list items (Ben, 10/20): a single line break in Claude's answer is shown as a blank line, so bullets
        // don't run together. Display only: the text sent to the Verifier and the log are unchanged.
        const fullText = lastSegments.map((x) => String(x.text)).join("");
        let pos = 0;
        const spaced = lastSegments.map((x) => {
          const t = String(x.text), start = pos; pos += t.length;
          let out = "";
          for (let i = 0; i < t.length; i++) {
            const c = t[i], g = start + i;
            out += (c === "\n" && fullText[g - 1] !== "\n" && fullText[g + 1] !== "\n") ? "\n\n" : c;
          }
          return out;
        });
        for (const [segIdx, seg] of lastSegments.entries()) {
          const span = el("span", "");
          appendBold(span, spaced[segIdx]); // shows **bold** as bold instead of asterisks (Ben, 10/20); text sent to the Verifier is unchanged
          if (typeof seg.confidence === "number") span.dataset.color = colorFor(seg.confidence);
          answer.appendChild(span);
        }
        searchUrls = Array.from(new Set(data.resultUrls || []));
        showSearched();
        const claims = lastSegments.filter((s) => typeof s.confidence === "number").map((s) => s.text.trim());
        // The gate (Ben, 10/13): only checkable questions go to the Verifier. The Replier's answer always shows.
        const calc = arithmetic(q.value);
        const lc = calc ? null : letterCount(q.value);
        if (verifyOn.checked && calc) showArithmetic(calc, answer.textContent);
        else if (verifyOn.checked && lc) showLetterCount(lc, answer.textContent);
        else if (verifyOn.checked && data.gate === "none") showNotCheckable(data.gateReason);
        // Never go blank (Ben, 10/13): if Claude marked no claims to check, say so.
        else if (verifyOn.checked && !claims.length) { verified.textContent = ""; verified.append(el("p", "bucket-note", "Claude didn't mark its answer as checkable fact, so nothing was verified.")); }
        else if (verifyOn.checked && claims.length) {
          status.textContent = ""; // the Verifier section shows its own working line now
          verified.textContent = "";
          // Cap long answers (Ben, 10/19): past 20 claims, ask before checking and show the rough cost.
          // Rough cost from the 49-claim run on 10/19: about 0.9 cents per claim, more if some need a second search.
          if (claims.length > CLAIM_CAP && !(await askToCheck(claims.length))) {
            verified.textContent = "";
            verified.append(el("p", "bucket-note", `Not checked. This answer has ${claims.length} claims.`));
            throw { skip: true };
          }
          verified.textContent = "";
          const working = el("div", "v-working"); working.append(el("span", "spinner"), el("span", "", `Checking ${claims.length} claim${claims.length > 1 ? "s" : ""} against reliable sources...`));
          verified.append(working);
          // Ability scores (Ben, 10/21): a separate call that rates each claim's demands, run alongside the Verifier.
          const scoredTexts = data.segments.filter((x) => typeof x.confidence === "number" && String(x.text).trim()).map((x) => String(x.text).trim());
          const abilitiesP = post("/abilities", { question: q.value, claims: scoredTexts }).catch((e) => ({ error: e.message }));
          // Wait for both, then show everything at once, so claims don't grow while you read (Ben, 10/21)
          const [vOut, abOut] = await Promise.all([post("/verify", { question: q.value, segments: data.segments }), abilitiesP]);
          showVerifier(vOut);
          showAbilities(abOut);
        }
        status.textContent = "";
      } catch (err) {
        if (!err?.skip) status.textContent = "ERROR: " + err.message;
        verified.querySelectorAll(".v-working").forEach((w) => w.remove()); answer.querySelectorAll(".v-working").forEach((w) => w.remove()); // no spinner left running after an error
      }
      q.disabled = false; send.disabled = false; verifyOn.disabled = false;
      q.focus(); // cursor back in the box for the next question
      await showBuild();
      saveScreenshot();
    });

    // Automatic screenshots (Ben, 10/7): after each answer, the page draws itself and the app saves it to Documentarian.
    async function saveScreenshot() {
      try {
        const canvas = await html2canvas(document.body, { backgroundColor: "#f9f9f7", scale: window.devicePixelRatio || 1 });
        await post("/screenshot", { image: canvas.toDataURL("image/png"), question: q.value });
      } catch (err) {
        status.textContent = "Screenshot not saved: " + err.message;
      }
    }
  </script>
</body>
</html>
