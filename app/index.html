<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Second Source</title>
  <style>
    body { font-family: sans-serif; max-width: 1200px; margin: 24px auto; padding: 0 16px; }
    .row { display: flex; gap: 16px; align-items: center; } /* gap doubled from 8px (Ben, 10/2) */
    #question { flex: 1; }
    /* Question box keeps the height it had at twice the default text size (39px); its text matches the Send button (Ben, 10/1). */
    #question { font-size: 1.17em; box-sizing: border-box; height: 39px; }
    /* Send and "Check answers" text match the "Default answer" heading size (Ben, 10/1). */
    #send, #verify-label { font-size: 1.17em; }
    #question { padding: 2px 4px; }
    #send { padding: 2px 12px; box-sizing: border-box; height: 39px; } /* same height as the question box (Ben, 10/2) */
    #verify-on { width: 18px; height: 18px; }
    .cols { display: flex; gap: 32px; align-items: flex-start; }
    .col { flex: 1; min-width: 0; }
    .heads h3 { margin-bottom: 4px; } /* halved from 8px (Ben, 10/2) */
    .head-right { display: flex; justify-content: space-between; align-items: baseline; }
    .head-line { border: 0; border-top: 1px solid #ccc; margin: 0; }
    .circles { display: flex; gap: 8px; }
    .circle { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; color: #000; font-weight: bold; cursor: default; }
    #answer { white-space: pre-wrap; }
    .hl-red { background: #ffc2c2; }
    .hl-yellow { background: #fff0a0; }
    .hl-green { background: #c8f0c8; }
    .claim { border-top: 1px solid #ccc; padding: 8px 0; }
    .claim:first-child { border-top: 0; } /* the full-width line under the headings replaces it (Ben, 10/2) */
    .claim-text { font-style: italic; }
    .verdict { font-weight: bold; }
    .uncited { text-decoration: underline dotted; }
    .flag { font-size: 0.8em; font-weight: bold; color: #a00; margin-left: 4px; }
    /* Build line pinned to the bottom of the window (Ben, 10/7). Page gets bottom padding so it never covers content. */
    #build { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; padding: 4px 16px; font-size: 0.8em; color: #666; background: #fff; border-top: 1px solid #ddd; }
    body { padding-bottom: 40px; }
    #build.stale { color: #a00; font-weight: bold; }
    .sources { font-size: 0.9em; margin: 4px 0 0 0; padding-left: 20px; }
    .piece { margin: 8px 0 12px 0; }
    .piece-text { font-weight: bold; margin: 6px 0 2px; }
    .no-source { font-weight: bold; color: #a00; }
    .bucket-label { font-weight: bold; margin: 2px 0; }
    .value-field { display: block; width: 100%; box-sizing: border-box; margin: 6px 0; padding: 4px; font-size: 1em; }
    .note { font-size: 0.9em; color: #666; }
    .list-label { font-weight: bold; margin: 6px 0 2px; }
    .para { margin: 4px 0 8px 12px; padding-left: 8px; border-left: 3px solid #ccc; }
    .para-src { font-size: 0.9em; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="row">
    <input id="question" type="text" />
    <button id="send">Submit</button>
  </div>
  <p id="status"></p>
  <!-- Headings sit in their own row so one line can run under both, full width (Ben, 10/2). -->
  <div class="cols heads">
    <h3 class="col">Default answer</h3>
    <!-- "Check answers" sits on the headings row, right aligned (Ben, 10/2). -->
    <div class="col head-right">
      <h3 id="verify-head">Verifier</h3>
      <label id="verify-label"><input id="verify-on" type="checkbox" checked /> Check answers</label>
    </div>
  </div>
  <hr class="head-line" />
  <div class="cols">
    <div class="col">
      <p><strong>Reasoning:</strong> <span id="summary"></span></p>
      <p class="circles">
        <span id="c-red" class="circle" style="background: red"></span>
        <span id="c-yellow" class="circle" style="background: gold"></span>
        <span id="c-green" class="circle" style="background: green"></span>
      </p>
      <p><strong>Answer:</strong></p>
      <div id="answer"></div>
    </div>
    <div class="col" id="verify-col">
      <div id="verified"></div>
    </div>
  </div>
  <p id="build"></p>
  <script src="/html2canvas.min.js"></script>
  <script>
    const q = document.getElementById("question");
    const send = document.getElementById("send");
    const verifyOn = document.getElementById("verify-on");
    const status = document.getElementById("status");
    const summary = document.getElementById("summary");
    const answer = document.getElementById("answer");
    const verified = document.getElementById("verified");
    const verifyCol = document.getElementById("verify-col");
    const COLORS = ["red", "yellow", "green"];
    const circle = (c) => document.getElementById("c-" + c);
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

    // Placeholder thresholds (Ben, 9/22): green above 95, yellow 80-95, red below 80.
    function colorFor(c) { if (c > 95) return "green"; if (c >= 80) return "yellow"; return "red"; }

    for (const color of COLORS) {
      circle(color).addEventListener("mouseenter", () => answer.querySelectorAll(`[data-color="${color}"]`).forEach((s) => s.classList.add("hl-" + color)));
      circle(color).addEventListener("mouseleave", () => answer.querySelectorAll(`[data-color="${color}"]`).forEach((s) => s.classList.remove("hl-" + color)));
    }
    const verifyHead = document.getElementById("verify-head");
    // Hiding Verifier hides its heading too; the heading keeps its space so the line still runs full width.
    verifyOn.addEventListener("change", () => { verifyCol.style.display = verifyOn.checked ? "" : "none"; verifyHead.style.visibility = verifyOn.checked ? "" : "hidden"; });

    async function post(url, body) {
      const res = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      return data;
    }

    // One box per sentence (Ben, 10/7). Inside it, each claim the Replier scored gets its own line, then its own
    // quoted evidence and links, or "No source found". Count is per claim (Ben, 10/7).
    const FAILED = ["Verifier's reply couldn't be read", "Verifier gave no answer for this claim"];
    // Bucket 3 (Ben, 10/12): a plain form, no warmth. For now it shows the user's own list back, next to the
    // Replier's answer; no summary, since that would mean the Verifier writing its own words (Ben, 10/13).
    function showOpinionForm() {
      verified.textContent = "";
      const box = el("div", "claim");
      box.append(el("p", "bucket-label", "Opinion or decision question"));
      box.append(el("p", "", "List 3 to 5 things you value most about this decision."));
      const fields = [];
      for (let i = 1; i <= 5; i++) { const f = el("input", "value-field"); f.placeholder = i <= 3 ? `${i}.` : `${i}. (optional)`; fields.push(f); box.append(f); }
      const msg = el("p", "note", "");
      const done = el("button", "", "Show my list");
      done.addEventListener("click", () => {
        const values = fields.map((f) => f.value.trim()).filter(Boolean);
        if (values.length < 3) { msg.textContent = "Please list at least 3."; return; }
        const out = el("div", "claim");
        out.append(el("p", "bucket-label", "What you value most about this decision:"));
        const ol = el("ol", ""); values.forEach((v) => ol.append(el("li", "", v))); out.append(ol);
        out.append(el("p", "note", "Compare these with the default answer on the left."));
        verified.textContent = ""; verified.append(out);
      });
      box.append(done, msg);
      verified.append(box);
    }
    // Bucket zero (Ben, 10/13): say why nothing is checked, never go blank.
    const ZERO_REASONS = {
      creative: "This looks like a creative request. Creative requests are out of scope, so nothing here was checked.",
      draft: "This looks like a request to draft or edit text. Drafts are out of scope, so nothing here was checked.",
      chat: "This looks like small talk, so there is nothing here to check.",
      other: "This doesn't look like a question of fact, so nothing here was checked.",
    };
    function showNotCheckable(reason) {
      verified.textContent = "";
      verified.append(el("p", "bucket-label", ZERO_REASONS[reason] || ZERO_REASONS.other));
    }

    function showVerifier(out) {
      verified.textContent = "";
      const boxes = [];
      for (const s of out.sections) {
        let b = boxes.find((x) => x.sentence === s.sentence);
        if (!b) { b = { sentence: s.sentence, claims: [] }; boxes.push(b); }
        b.claims.push(s);
      }
      for (const b of boxes) {
        const box = el("div", "claim");
        box.append(el("p", "claim-text", b.sentence));
        for (const s of b.claims) {
          const piece = el("div", "piece");
          piece.append(el("p", "piece-text", "\u201c" + s.claim + "\u201d"));
          // Contested claims and opinions get a plain label (Ben, 10/12). How labels look is a UI question for later.
          if (s.bucket === "contested") piece.append(el("p", "bucket-label", "Contested: " + s.verdict.toLowerCase()));
          if (s.bucket === "opinion") piece.append(el("p", "bucket-label", "Opinion"));
          const lists = (s.kind === "opinion" ? [["Held by", s.confirms || []]]
            : [["Supports", s.confirms || []], ["Contradicts", s.contradicts || []], ["Says this is unsettled", s.unsettled || []]]).filter(([, l]) => l.length);
          for (const [label, list] of lists) {
            piece.append(el("p", "list-label", label + ":"));
            for (const p of list) {
              const q = el("div", "para", "\u201c" + p.quote + "\u201d");
              const src = el("div", "para-src");
              const a = el("a", "", p.host); a.href = p.url; a.target = "_blank"; a.rel = "noopener"; a.title = p.title || "";
              src.append(a); q.append(src); piece.append(q);
            }
          }
          if (!lists.length) piece.append(el("p", "no-source", FAILED.includes(s.verdict) ? s.verdict : "No source found"));
          else piece.append(el("p", "", `Reliable sources cited: ${s.sourceCount}`));
          box.append(piece);
        }
        verified.append(box);
      }
    }

    // Build line (Ben, 10/7): shows which version is running; warns when the app needs a restart.
    const buildLine = document.getElementById("build");
    const when = (t) => new Date(t).toLocaleString([], { month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit" });
    async function showBuild() {
      try {
        const b = await (await fetch("/version")).json();
        buildLine.textContent = `Build: code ${when(b.codeChanged)} · page ${when(b.pageChanged)} · app started ${when(b.started)}` +
          (b.stale ? " · CODE CHANGED SINCE START: restart the app" : "");
        buildLine.className = b.stale ? "stale" : "";
      } catch { buildLine.textContent = "Build: unknown (app may need a restart)"; }
    }
    showBuild();

    // Enter in the question box works the same as clicking Submit (Ben, 10/7).
    q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); send.click(); } });

    send.addEventListener("click", async () => {
      // The user can't move forward until both answers are in (blocking).
      q.disabled = true; send.disabled = true; verifyOn.disabled = true;
      COLORS.forEach((c) => (circle(c).textContent = ""));
      summary.textContent = ""; answer.textContent = ""; verified.textContent = "";
      status.textContent = "Thinking...";
      try {
        const data = await post("/ask", { question: q.value });
        summary.textContent = data.summary;
        for (const seg of data.segments) {
          const span = el("span", "", seg.text);
          const c = seg.confidence;
          if (typeof c === "number") {
            const color = colorFor(c);
            span.dataset.color = color;
            span.addEventListener("mouseenter", () => { circle(color).textContent = c; span.classList.add("hl-" + color); });
            span.addEventListener("mouseleave", () => { circle(color).textContent = ""; span.classList.remove("hl-" + color); });
          }
          answer.appendChild(span);
        }
        const claims = data.segments.filter((s) => typeof s.confidence === "number").map((s) => s.text.trim());
        // The gate (Ben, 10/13): only checkable questions go to the Verifier. The Replier's answer always shows.
        if (verifyOn.checked && data.gate === "opinion") showOpinionForm();
        else if (verifyOn.checked && data.gate === "none") showNotCheckable(data.gateReason);
        else if (verifyOn.checked && claims.length) {
          status.textContent = `Checking ${claims.length} claim${claims.length > 1 ? "s" : ""} against reliable sources...`;
          showVerifier(await post("/verify", { question: q.value, segments: data.segments })); // Verifier gets each piece with its sentence (Ben, 10/7)
        }
        status.textContent = "";
      } catch (err) {
        status.textContent = "ERROR: " + err.message;
      }
      q.disabled = false; send.disabled = false; verifyOn.disabled = false;
      await showBuild();
      saveScreenshot();
    });

    // Automatic screenshots (Ben, 10/7): after each answer, the page draws itself and the app saves it to Documentarian.
    async function saveScreenshot() {
      try {
        const canvas = await html2canvas(document.body, { backgroundColor: "#ffffff", scale: window.devicePixelRatio || 1 });
        await post("/screenshot", { image: canvas.toDataURL("image/png"), question: q.value });
      } catch (err) {
        status.textContent = "Screenshot not saved: " + err.message;
      }
    }
  </script>
</body>
</html>
